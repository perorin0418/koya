# koya のセッション機能（koya run --session）で使う tmux の設定。
# tmux の存在をなるべく意識させず、端末の画面をそのまま見せる。

# ステータス行を出さない（画面の行数を変えない）
set -g status off
# Esc キーの遅延をなくす
set -g escape-time 10
set -g history-limit 50000
# ホイールでスクロールできるようにする（文字の選択は Shift を押しながら）
set -g mouse on
set -g default-terminal "tmux-256color"
# 24bit カラー
set -ga terminal-overrides ",*:RGB"
# OSC 52 でクリップボードに渡す
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g extended-keys on
# コマンドなしで始めたときは koya のプロンプト付きの bash にする
set -g default-command "bash --rcfile /etc/koya/bashrc -i"
